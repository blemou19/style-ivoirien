<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail de la commande | Style Ivoirien</title>
<link rel="preload" href="fonts/work-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=20261031b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="theme-color" content="#B85C38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <img src="img/logo.png" alt="Style Ivoirien" width="44" height="44">
      </span>
      <span class="logo-text">
        <span class="line1">Style Ivoirien</span>
        <span class="line2">COUTURE &amp; BOUTIQUE</span>
      </span>
    </a>
  </div>
</header>
<div class="page-header-lite">
  <p class="eyebrow">Détail de la commande</p>
  <h1 id="commande-titre">Commande</h1>
</div>
<section>
  <div class="wrap" style="max-width:640px;">
    <div id="commande-contenu"></div>
  </div>
</section>
<footer>
  <div class="footer-bottom" style="max-width:1100px; margin:0 auto; padding:24px;">
    <span>© 2026 Style Ivoirien</span>
    <span class="footer-legal"><a href="mentions-legales.html" class="admin-link">Mentions légales &amp; CGV</a>
    <a href="confidentialite.html" class="admin-link">Confidentialité</a></span>
  </div>
</footer>
<script src="js/securite.js?v=20261031b"></script>
<script src="js/devise.js?v=20261031b"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const brut = params.get('d');
  const conteneur = document.getElementById('commande-contenu');
  if (!brut) {
    conteneur.innerHTML = '<p style="text-align:center; color:#665b51;">Aucune commande à afficher.</p>';
  } else {
    try {
      const commande = JSON.parse(brut);
      const dateFormatee = new Date(commande.date).toLocaleString('fr-FR');
      document.getElementById('commande-titre').textContent = commande.reference ? `Commande ${commande.reference}` : 'Commande';

      // anciennes commandes : tout en GNF ; nouvelles : dans la devise choisie par le client
      const devise = DEVISES[commande.devise] ? commande.devise : 'GNF';
      const lignesArticles = commande.articles.map(item => `
        <div class="panier-item">
          <div class="panier-item-image">
            ${item.image_url ? `<img src="${urlSure(item.image_url)}" alt="${esc(item.nom)}">` : ''}
          </div>
          <div class="panier-item-info">
            <span class="panier-item-nom">${esc(item.nom)}${item.taille ? `, taille ${esc(item.taille)}` : ''}</span>
            <span class="panier-item-prix">${esc(item.qty)} x ${formaterMontant(montantProduit(item, devise), devise)}</span>
          </div>
        </div>
      `).join('');

      const estFrance = !!commande.estFrance;
      const commission = commande.commission || 0;
      const totalArticles = commande.totalDevise ?? Number(commande.total);
      const totalFinal = commande.totalFinal || (totalArticles + commission);

      const recapHtml = `
        <div class="panier-recap" style="margin-top:20px;">
          ${commission ? `<div class="panier-recap-ligne">
            <span>Prix du panier</span>
            <span>${formaterMontant(totalArticles, devise)}</span>
          </div>
          <div class="panier-recap-ligne">
            <span>Commission service</span>
            <span>${formaterMontant(commission, devise)}</span>
          </div>` : ''}
          <div class="panier-recap-ligne panier-recap-total">
            <span>Total à payer</span>
            <span>${formaterMontant(totalFinal, devise)}</span>
          </div>
          ${devise !== 'GNF' ? `<p class="panier-recap-note">Prix boutique : ${formaterMontant(Number(commande.total), 'GNF')}</p>` : ''}
          ${estFrance ? `<p class="panier-recap-note">⚠️ Ce montant ne couvre pas la livraison. Frais d'expédition : environ ${fraisParKilo(devise)}, montant exact communiqué séparément une fois le colis prêt et pesé.</p>` : ''}
        </div>
      `;

      conteneur.innerHTML = `
        <p style="color:#665b51; margin-bottom:20px;">Reçue le ${dateFormatee}</p>
        <div style="border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px;">
          <p><strong>Client :</strong> ${esc(commande.nom)}</p>
          <p><strong>Téléphone :</strong> ${esc(commande.telephone)}</p>
          <p><strong>Zone :</strong> ${esc(commande.zone || '—')}</p>
        </div>
        ${lignesArticles}
        ${recapHtml}
      `;
    } catch (e) {
      conteneur.innerHTML = '<p style="text-align:center; color:#665b51;">Impossible d\'afficher cette commande.</p>';
    }
  }
</script>
</body>
</html>
