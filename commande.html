<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail de la commande — Style Ivoirien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="theme-color" content="#B85C38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <img src="img/logo.png" alt="Style Ivoirien">
      </span>
      <span class="logo-text">
        <span class="line1">Style Ivoirien</span>
        <span class="line2">COUTURE &amp; BOUTIQUE</span>
      </span>
    </a>
  </div>
</header>
<div class="page-header-lite">
  <p class="eyebrow">Détail de la commande</p>
  <h1 id="commande-titre">Commande</h1>
</div>
<section>
  <div class="wrap" style="max-width:640px;">
    <div id="commande-contenu"></div>
  </div>
</section>
<footer>
  <div class="footer-bottom" style="max-width:1100px; margin:0 auto; padding:24px;">
    <span>© 2026 Style Ivoirien</span>
  </div>
</footer>
<script>
  const TAUX_EUR = 10100; // GNF pour 1 euro — garder synchronisé avec js/main.js
  const params = new URLSearchParams(window.location.search);
  const brut = params.get('d');
  const conteneur = document.getElementById('commande-contenu');
  if (!brut) {
    conteneur.innerHTML = '<p style="text-align:center; color:#7a6f64;">Aucune commande à afficher.</p>';
  } else {
    try {
      const commande = JSON.parse(brut);
      const dateFormatee = new Date(commande.date).toLocaleString('fr-FR');
      document.getElementById('commande-titre').textContent = commande.reference ? `Commande ${commande.reference}` : 'Commande';

      const lignesArticles = commande.articles.map(item => `
        <div class="panier-item">
          <div class="panier-item-image">
            ${item.image_url ? `<img src="${item.image_url}" alt="${item.nom}">` : ''}
          </div>
          <div class="panier-item-info">
            <span class="panier-item-nom">${item.nom}${item.taille ? ` — Taille ${item.taille}` : ''}</span>
            <span class="panier-item-prix">${item.qty} x ${Number(item.prix).toLocaleString('fr-FR')} GNF</span>
          </div>
        </div>
      `).join('');

      const estFrance = !!commande.estFrance;
      const commission = commande.commission || 0;
      const totalFinal = commande.totalFinal || (Number(commande.total) + commission);

      const recapHtml = `
        <div class="panier-recap" style="margin-top:20px;">
          <div class="panier-recap-ligne">
            <span>Prix du panier</span>
            <span>${Number(commande.total).toLocaleString('fr-FR')} GNF${estFrance ? ` (≈ ${(commande.total / TAUX_EUR).toFixed(2)} €)` : ''}</span>
          </div>
          <div class="panier-recap-ligne">
            <span>Commission service</span>
            <span>${estFrance ? (commission / TAUX_EUR).toFixed(2) + ' €' : commission.toLocaleString('fr-FR') + ' GNF'}</span>
          </div>
          <div class="panier-recap-ligne panier-recap-total">
            <span>Total à payer</span>
            <span>${totalFinal.toLocaleString('fr-FR')} GNF${estFrance ? ` (≈ ${(totalFinal / TAUX_EUR).toFixed(2)} €)` : ''}</span>
          </div>
          ${estFrance ? '<p class="panier-recap-note">⚠️ Ce montant ne couvre pas la livraison. Frais d\'expédition : environ 12€/kg (≈ 121 200 GNF/kg), montant exact communiqué séparément une fois le colis prêt et pesé.</p>' : ''}
        </div>
      `;

      conteneur.innerHTML = `
        <p style="color:#7a6f64; margin-bottom:20px;">Reçue le ${dateFormatee}</p>
        <div style="border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px;">
          <p><strong>Client :</strong> ${commande.nom}</p>
          <p><strong>Téléphone :</strong> ${commande.telephone}</p>
          <p><strong>Zone :</strong> ${commande.zone || '—'}</p>
        </div>
        ${lignesArticles}
        ${recapHtml}
      `;
    } catch (e) {
      conteneur.innerHTML = '<p style="text-align:center; color:#7a6f64;">Impossible d\'afficher cette commande.</p>';
    }
  }
</script>
</body>
</html>
